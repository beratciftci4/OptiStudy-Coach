[client]
# Hata kutularındaki Google/ChatGPT arama linklerini gizle
showErrorLinks = false

# --- Tema ---------------------------------------------------------------
# Açık ve koyu mod ayrı tanımlı; kullanıcı ayarlardan geçiş yapabilir.
# Grafik renkleri optistudy/charts.py içindeki LIGHT_COLORS / DARK_COLORS ile aynı aileden.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
metricValueFontSize = "1.9rem"
metricValueFontWeight = 650
paddingTop = "2rem"

[theme.light]
primaryColor = "#256abf"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#1c5cab"
codeBackgroundColor = "#f1f0ec"
greenColor = "#0a8a0a"
redColor = "#d03b3b"
orangeColor = "#c96a00"
dataframeHeaderBackgroundColor = "#f1f0ec"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#2a78d6"
backgroundColor = "#121211"
secondaryBackgroundColor = "#1d1d1b"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#86b6ef"
codeBackgroundColor = "#1d1d1b"
greenColor = "#0ca30c"
redColor = "#e66767"
orangeColor = "#ec835a"
dataframeHeaderBackgroundColor = "#1d1d1b"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.light.sidebar]
backgroundColor = "#f4f3ef"
secondaryBackgroundColor = "#e9e8e2"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
primaryColor = "#256abf"
linkColor = "#1c5cab"

[theme.dark.sidebar]
backgroundColor = "#0b0b0a"
secondaryBackgroundColor = "#1d1d1b"
textColor = "#f0efec"
borderColor = "#2c2c2a"
primaryColor = "#2a78d6"
linkColor = "#86b6ef"
